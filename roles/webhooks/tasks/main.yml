---
# The webhook.site app container's internal nginx proxies /socket.io to a host
# named "laravel-echo-server", and both it and the app reach redis by the name
# "redis", so all three containers share a dedicated network with those names.
- name: create the webhooks network
  docker_network:
    name: webhooks
- name: run the redis container
  docker_container:
    name: webhook-redis
    image: redis:alpine
    pull: true
    state: started
    restart_policy: unless-stopped
    networks: [{name: webhooks, aliases: [redis]}]
- name: run the laravel-echo-server container
  docker_container:
    name: laravel-echo-server
    image: webhooksite/laravel-echo-server
    pull: true
    state: started
    restart_policy: unless-stopped
    networks: [{name: webhooks}]
    command: exec laravel-echo-server start --force
    env:
      LARAVEL_ECHO_SERVER_AUTH_HOST: http://webhook-site
      LARAVEL_ECHO_SERVER_HOST: 0.0.0.0
      LARAVEL_ECHO_SERVER_PORT: "6001"
      ECHO_REDIS_PORT: "6379"
      ECHO_REDIS_HOSTNAME: redis
      ECHO_PROTOCOL: http
      ECHO_ALLOW_CORS: "true"
      ECHO_ALLOW_ORIGIN: "*"
      ECHO_ALLOW_METHODS: "*"
      ECHO_ALLOW_HEADERS: "*"
- name: run the webhook.site container
  docker_container:
    name: webhook-site
    image: webhooksite/webhook.site
    pull: true
    state: started
    restart_policy: unless-stopped
    networks: [{name: webhooks}]
    published_ports:
      - "{{webhooks_port}}:80"
    # The base image runs nginx and php-fpm on its own; the command is the
    # extra process it supervises, here the queue worker that handles actions.
    command: php artisan queue:work --daemon --tries=3 --timeout=10
    env:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "https://{{webhooks_domain}}"
      APP_LOG: errorlog
      DB_CONNECTION: sqlite
      REDIS_HOST: redis
      BROADCAST_DRIVER: redis
      CACHE_DRIVER: redis
      QUEUE_DRIVER: redis
      ECHO_HOST_MODE: path
- name: configure nginx
  include_role: {name: nginx_standard}
  vars: {domain: "{{webhooks_domain}}", service_port: "{{webhooks_port}}"}
