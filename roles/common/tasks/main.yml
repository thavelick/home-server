---
- name: Update and upgrade apt packages
  become: true
  apt:
    upgrade: true
    update_cache: true
    cache_valid_time: 86400  # One day
- name: install common packages
  apt:
    name:
      - acl
      - avahi-daemon
      - curl
      - fancontrol
      - git
      - lm-sensors
      - nginx
      - ntp
      - postgresql
      - python3
      - python3-pip
      - python3-psycopg2
      - sqlite3
      - vim
- name: start and enable ntp
  become: true
  service:
    name: ntp
    state: started
    enabled: true
- name: start and enable avahi-daemon
  become: true
  service:
    name: avahi-daemon
    state: started
    enabled: true
- name: copy nginx sever config
  register: nginx_config
  copy:
    src: files/nginx.conf
    dest: /etc/nginx/nginx.conf
- name: restart nginx
  when: nginx_config.changed
  service:
    name: nginx
    state: restarted
# Keys only. Drop-ins load before the main sshd_config, and sshd keeps the
# first value it sees, so this wins over the Debian default.
- name: disable ssh password logins
  register: sshd_config
  copy:
    dest: /etc/ssh/sshd_config.d/10-no-passwords.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    validate: /usr/sbin/sshd -t -f %s
- name: reload sshd
  when: sshd_config.changed
  service:
    name: ssh
    state: reloaded
- name: set the timezone to mountain time
  timezone:
    name: America/Denver
