---
- name: install kiwix tools (includes kiwix-server)
  apt:
    name:
      - kiwix-tools
- name: make all the folders
  file:
    path: "{{item}}"
    state: directory
    owner: 'www-data'
    group: 'www-data'
  with_items:
    - "{{kiwix_site_root}}"
    - "{{kiwix_site_root}}/data"
    - "{{kiwix_site_root}}/scripts"
- name: copy the start script (with exec permissions)
  copy:
    src: files/start.sh
    dest: "{{kiwix_site_root}}/scripts/start.sh"
    owner: 'www-data'
    group: 'www-data'
    mode: '0755'
# TEMPORARILY DISABLED: kiwix is kept stopped/disabled and its nginx site is
# unpublished. To restore, remove the service_state/service_enabled overrides
# and the nginx_state override below.
- name: configure service
  include_role: {name: service_standard}
  vars: {service_name: kiwix, service_state: stopped, service_enabled: false}
- name: configure nginx
  include_role: {name: nginx_standard}
  vars: {domain: "{{kiwix_domain}}", service_port: 8181, nginx_state: absent}
