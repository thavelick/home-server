# Catch-all vhost: serves a generic page for any hostname that does not match a
# configured service (e.g. home.tristanhavelick.com or unknown subdomains),
# instead of nginx's packaged default page.
server {
    listen 80 default_server;
    server_name _;

    root /var/www/default;
    default_type text/plain;
    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/home.tristanhavelick.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/home.tristanhavelick.com/privkey.pem;

    root /var/www/default;
    default_type text/plain;
    location / {
        try_files $uri /index.html;
    }
}
