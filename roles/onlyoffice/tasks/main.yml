---
- name: create directories
  file:
    path: "{{item}}"
    state: directory
    owner: www-data
    group: www-data
    mode: 0755
  loop:
    - "{{onlyoffice_base_directory}}"
    - "{{onlyoffice_data_directory}}"
# TEMPORARILY DISABLED: the onlyoffice container is kept stopped and its nginx
# site is unpublished. To restore, set state back to 'started', re-enable the
# image pull, and remove the nginx_state override below.
- name: run the onlyoffice container
  docker_container:
    name: onlyoffice
    image: onlyoffice/documentserver:latest
    state: stopped
    restart_policy: unless-stopped
    published_ports:
      - "9786:80"
    volumes:
      - "{{onlyoffice_data_directory}}:/var/www/onlyoffice/Data"
    env:
      JWT_SECRET: "{{onlyoffice_jwt_secret}}"
    pull: false
- name: configure nginx
  include_role: {name: nginx_standard}
  vars: {domain: "{{onlyoffice_domain}}", service_port: 9786, nginx_state: absent}
